name: Build and Push Docker Image
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker Image release version (format: vX.Y.Z)'
        required: false
        type: string
env:
  BASE_IMAGE_NAME: "innodiskorg/acceltune-quantization-gguf-tool"

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      -
        name: Checkout repo
        uses: actions/checkout@v4

      -
        name: Validate version with regex
        run: |
          echo "Input version: ${{ github.event.inputs.version }}"
          if [[ "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version is valid"
          else
            echo "Invalid version format. Please use 'vX.Y.Z' format."
            exit 1
          fi

          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "Validated version: ${{ github.event.inputs.version }}"
        id: get_version
  
  build-quantization-gguf-tool:
    runs-on: ubuntu-latest
    needs: validate-inputs
    env:
      VERSION: ${{ needs.validate-inputs.outputs.version}}
    steps:
      -
        name: Checkout repo
        uses: actions/checkout@v4
          
      -
        name: Login Docker Hub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      -
        name: Build docker image
        run: |
          docker build \
          -t ${{ env.BASE_IMAGE_NAME }}:${{ env.VERSION }} \
          -f docker/Dockerfile .
      
      -
        name: Push docker image
        run: |
          docker push ${{ env.BASE_IMAGE_NAME }}:${{ env.VERSION }}